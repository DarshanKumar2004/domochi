# The feedback relay (see feedback-worker.js and README.md).
# Secrets (RESEND_API_KEY, FEEDBACK_TO) are set with `npx wrangler secret put`, never here.
name = "domochi-feedback"
main = "feedback-worker.js"
compatibility_date = "2025-01-01"
# Served at https://domochi-feedback.kumardarshan425.workers.dev (no preview links needed).
workers_dev = true
preview_urls = false

[vars]
# Pages allowed to send reports: the live site, the Android app (Capacitor serves it from https://localhost), and the dev server.
ALLOWED_ORIGINS = "https://darshankumar2004.github.io,https://localhost,http://localhost:5173"
