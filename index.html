<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f1a17" />
    <title>domochi: the mochi donut game</title>
    <meta name="description" content="Run the domochi trailer in Lafayette: fry, glaze, top and box mochi donuts for your customers. Free to play in your browser." />
    <meta property="og:title" content="domochi: the mochi donut game" />
    <meta property="og:description" content="Fry, glaze, top and box mochi donuts at Lafayette's first mochi donut trailer. taste sweetness, spark greatness." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1f1a17; /* domochi ink */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /*
        Pinned to the screen and clipped: while a phone rotates, the canvas is
        briefly the old orientation's size. If it could overflow the page,
        mobile browsers zoom out to fit it and the game gets stuck as a small box.
      */
      #game {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
