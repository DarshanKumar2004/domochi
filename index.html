<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f1a17" />
    <title>domochi: the mochi donut game</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1f1a17; /* domochi ink */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /*
        Pinned to the screen and clipped: while a phone rotates, the canvas is
        briefly the old orientation's size. If it could overflow the page,
        mobile browsers zoom out to fit it and the game gets stuck as a small box.
      */
      #game {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #game canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
