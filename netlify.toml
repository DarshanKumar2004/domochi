# Netlify: builds the game and serves dist/. See DECISIONS.md (Phase 7).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite's hashed build files never change, so browsers can keep them forever.
[[headers]]
  for = "/build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything else (the page, art, icons) is checked for updates each visit.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
